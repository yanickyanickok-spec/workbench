<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>爆单的林舒琪</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

    <!-- 顶部栏 -->
    <header class="top-bar">
        <div class="logo">
            <span class="avatar">林</span>
            <div>
                <div class="app-name">爆单的林舒琪</div>
                <div class="app-sub">美甲生意工作台</div>
            </div>
        </div>
        <div class="time" id="clock">--:--</div>
    </header>

    <!-- 分栏 Tab 切换 -->
    <nav class="tabs">
        <button class="tab active" data-tab="overview">总览</button>
        <button class="tab" data-tab="xiaohongshu">小红书</button>
        <button class="tab" data-tab="douyin">抖音</button>
        <button class="tab" data-tab="tasks">待办</button>
        <button class="tab" data-tab="finance">理财</button>
        <button class="tab" data-tab="health">健康</button>
    </nav>

    <!-- 内容区 -->
    <main class="content">

        <!-- 总览页 -->
        <section class="tab-pane active" id="pane-overview">
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-num" id="stat-xhs">0</div>
                    <div class="stat-label">小红书爆款</div>
                </div>
                <div class="stat-card">
                    <div class="stat-num" id="stat-douyin">0</div>
                    <div class="stat-label">抖音爆款</div>
                </div>
                <div class="stat-card">
                    <div class="stat-num" id="stat-tasks">0</div>
                    <div class="stat-label">待办事项</div>
                </div>
            </div>
            <div class="quick-note">
                <h3>📌 今日重点</h3>
                <p id="daily-focus">加载中...</p>
            </div>
            <a class="edit-btn" href="https://github.com/yanickyanickok-spec/workbench/edit/main/data.js" target="_blank">
                ✏️ 编辑数据
            </a>
        </section>

        <!-- 小红书页 -->
        <section class="tab-pane" id="pane-xiaohongshu">
            <div class="section-title">
                <span>📕</span> 小红书美甲爆款
            </div>
            <div class="card-list" id="xhs-list"></div>
        </section>

        <!-- 抖音页 -->
        <section class="tab-pane" id="pane-douyin">
            <div class="section-title">
                <span>🎵</span> 抖音美甲爆款
            </div>
            <div class="card-list" id="douyin-list"></div>
        </section>

        <!-- 待办页 -->
        <section class="tab-pane" id="pane-tasks">
            <div class="section-title">
                <span>✅</span> 今日待办
            </div>
            <div class="todo-list" id="todo-list"></div>
        </section>

        <!-- 理财页 -->
        <section class="tab-pane" id="pane-finance">
            <div class="section-title">
                <span>💰</span> 私人理财
            </div>
            <div class="card-list" id="finance-list"></div>
        </section>

        <!-- 健康页 -->
        <section class="tab-pane" id="pane-health">
            <div class="section-title">
                <span>💪</span> 健身 & 营养
            </div>
            <div class="card-list" id="health-list"></div>
        </section>

    </main>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
