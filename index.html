<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>爆单的林舒琪 · 全能工作台</title>
    <style>
        :root { --bg: #121212; --card-bg: #1e1e1e; --text: #ffffff; --sub-text: #a0a0a0; --accent: #ff79c6; --success: #50fa7b; --border: #333; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: #181818; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; border-right: 1px solid var(--border); position: fixed; height: 100vh; overflow-y: auto; }
        .profile { text-align: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .avatar { font-size: 48px; margin-bottom: 10px; }
        .name { font-size: 18px; font-weight: bold; margin: 5px 0; }
        .sub { font-size: 12px; color: var(--sub-text); }
        .panel { background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        .panel-title { font-size: 14px; color: var(--accent); margin: 0 0 12px 0; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .panel-content { display: none; }
        .panel.active .panel-content { display: block; }
        .todo-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 14px; border-bottom: 1px solid #2a2a2a; cursor: pointer; }
        .todo-item:last-child { border-bottom: none; }
        .todo-text { flex: 1; word-break: break-all; }
        .habit-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; font-size: 13px; }
        .habit-item { display: flex; align-items: center; gap: 5px; }
        .editor { width: 100%; background: #2a2a2a; border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 6px; font-size: 12px; margin-top: 8px; box-sizing: border-box; resize: vertical; min-height: 60px; }
        .edit-btn { background: var(--accent); color: #000; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; margin-top: 8px; font-weight: bold; }
        .main { flex: 1; padding: 20px; margin-left: 280px; box-sizing: border-box; padding-bottom: 80px;}
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .date-display { color: var(--sub-text); font-size: 14px; }
        .news-list { display: flex; flex-direction: column; gap: 12px; }
        .news-card { background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border); transition: transform 0.2s; cursor: pointer; }
        .news-card:hover { transform: translateY(-2px); border-color: var(--accent); }
        .news-title { font-size: 15px; font-weight: bold; margin: 0 0 8px 0; display: flex; align-items: center; gap: 8px; }
        .news-desc { font-size: 13px; color: var(--sub-text); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal { background: var(--card-bg); width: 90%; max-width: 600px; max-height: 80vh; border-radius: 16px; border: 1px solid var(--border); overflow: hidden; animation: popIn 0.3s ease; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; overflow-y: auto; font-size: 15px; line-height: 1.8; color: var(--text); max-height: 60vh; }
        .modal-close { background: none; border: none; color: var(--sub-text); font-size: 24px; cursor: pointer; }
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--success); color: #000; padding: 10px 20px; border-radius: 20px; font-weight: bold; display: none; z-index: 101; }
        .loading { text-align: center; padding: 20px; color: var(--sub-text); }
        @media (max-width: 768px) { .layout { flex-direction: column; } .sidebar { width: 100%; position: relative; height: auto; } .main { margin-left: 0; } }
    </style>
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <div class="profile">
            <div class="avatar" id="sideAvatar">🐰</div>
            <div class="name" id="sideName">爆单的林舒琪</div>
            <div class="sub" id="sideSub">点击头像编辑资料</div>
        </div>

        <div class="panel active">
            <div class="panel-title">🏋️ 健身与饮食记录</div>
            <div class="panel-content" style="display:block;">
                <label style="font-size:12px; color:var(--sub-text);">今日训练计划:</label>
                <textarea class="editor" id="planEditor" placeholder="例如：深蹲 4组*12次..."></textarea>
                <label style="font-size:12px; color:var(--sub-text); margin-top:8px; display:block;">今日饮食记录:</label>
                <textarea class="editor" id="dietEditor" placeholder="例如：早餐 鸡蛋*2 牛奶 500ml..."></textarea>
                <button class="edit-btn" onclick="saveFitness()">💾 保存记录</button>
            </div>
        </div>

        <div class="panel active">
            <div class="panel-title">✅ 每日习惯打卡</div>
            <div class="panel-content" style="display:block;">
                <div class="habit-grid" id="habitGrid"></div>
            </div>
        </div>

        <div class="panel active">
            <div class="panel-title">📝 待计划清单</div>
            <div class="panel-content" style="display:block;">
                <div style="display:flex; gap:10px; margin-bottom:10px;">
                    <input type="text" id="todoInput" placeholder="添加新计划..." style="flex:1; background:#2a2a2a; border:1px solid var(--border); color:white; padding:8px; border-radius:6px;">
                    <button class="edit-btn" onclick="addTodo()" style="margin:0; padding:8px 12px;">➕</button>
                </div>
                <div id="todoList"></div>
            </div>
        </div>
    </aside>

    <main class="main">
        <div class="header">
            <h1 id="greeting" style="margin:0; font-size:24px;">☀️ 早上好</h1>
            <div class="date-display" id="todayDate"></div>
        </div>
        
        <div style="margin-bottom: 20px; font-size: 14px; color: var(--accent);" id="dailyQuote">
            💡 正在加载今日灵感...
        </div>

        <div class="news-list" id="newsContainer">
            <div class="loading">正在抓取最新热榜...</div>
        </div>
    </main>
</div>

<div class="modal-overlay" id="readerModal" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 style="margin:0; font-size:18px;" id="modalTitle">标题</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody">内容加载中...</div>
    </div>
</div>

<div class="toast" id="toast">✅ 已保存</div>

<script>
// ========== 1. 数据持久化 (LocalStorage) ==========
let appData = JSON.parse(localStorage.getItem('dashboardData')) || {
    habits: [{id: 1, name: '早起打卡', done: false}, {id: 2, name: '喝水 2L', done: false}, {id: 3, name: '阅读 30min', done: false}, {id: 4, name: '23:00前睡', done: false}],
    todos: [],
    fitness: { plan: '', diet: '' }
};

function saveData() {
    localStorage.setItem('dashboardData', JSON.stringify(appData));
}

// ========== 2. 页面渲染 ==========
function renderUI() {
    document.getElementById('todayDate').textContent = new Date().toLocaleDateString('zh-CN');
    const hours = new Date().getHours();
    document.getElementById('greeting').textContent = hours < 12 ? '☀️ 早上好' : hours < 18 ? '🌤️ 下午好' : '🌇 晚上好';
    
    document.getElementById('planEditor').value = appData.fitness.plan;
    document.getElementById('dietEditor').value = appData.fitness.diet;

    document.getElementById('habitGrid').innerHTML = appData.habits.map(h => `
        <div class="habit-item" onclick="toggleHabit(${h.id})">
            <span style="font-size:18px;">${h.done ? '✅' : '⬜'}</span><span>${h.name}</span>
        </div>`).join('');
    
    document.getElementById('todoList').innerHTML = appData.todos.map(t => `
        <div class="todo-item" onclick="toggleTodo(${t.id})">
            <span>${t.done ? '✅' : '⬜'}</span><span class="todo-text" style="${t.done?'text-decoration:line-through;color:#555':''}">${t.text}</span>
            <span onclick="delTodo(${t.id})">🗑️</span>
        </div>`).join('');
}

// ========== 3. 交互功能 ==========
function saveFitness() {
    appData.fitness.plan = document.getElementById('planEditor').value;
    appData.fitness.diet = document.getElementById('dietEditor').value;
    saveData(); showToast('🏋️ 健身记录已保存');
}
function toggleHabit(id) { const h = appData.habits.find(x=>x.id===id); h.done = !h.done; saveData(); renderUI(); }
function addTodo() {
    const input = document.getElementById('todoInput');
    if(input.value.trim()) {
        appData.todos.push({id: Date.now(), text: input.value, done: false});
        input.value = ''; saveData(); renderUI();
    }
}
function toggleTodo(id) { const t = appData.todos.find(x=>x.id===id); t.done = !t.done; saveData(); renderUI(); }
function delTodo(id) { appData.todos = appData.todos.filter(x=>x.id!==id); saveData(); renderUI(); }

function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(()=>t.style.display='none', 2000); }
function openModal(title, content) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = content;
    document.getElementById('readerModal').style.display = 'flex';
}
function closeModal(e) { if(!e || e.target.id === 'readerModal') document.getElementById('readerModal').style.display = 'none'; }

// ========== 4. 自动更新功能 (调用免费API) ==========
async function fetchDailyQuote() {
    try {
        const res = await fetch('https://v1.hitokoto.cn/');
        const data = await res.json();
        document.getElementById('dailyQuote').textContent = `💡 ${data.hitokoto} —— ${data.from || '每日灵感'}`;
    } catch(e) { document.getElementById('dailyQuote').textContent = '💡 今天也要加油鸭！'; }
}

async function fetchNews() {
    try {
        // 使用免费的知乎热榜 API (支持跨域)
        const res = await fetch('https://api.vvhan.com/api/hotlist?type=zhihu');
        const data = await res.json();
        if(data.success) {
            const container = document.getElementById('newsContainer');
            container.innerHTML = data.data.slice(0, 10).map((item, index) => `
                <div class="news-card" onclick="openModal('${item.title.replace(/'/g, "\\'")}', '<p>🔥 热度排名：${index+1}</p><p>👉 <a href=${item.url} target=_blank style=color:#ff79c6;>点击这里去原帖查看详情</a></p>')">
                    <div class="news-title">🔥 ${item.title}</div>
                    <div class="news-desc">点击查看详情或前往原链接...</div>
                </div>
            `).join('');
        }
    } catch(e) {
        document.getElementById('newsContainer').innerHTML = '<div class="loading">资讯加载失败，请稍后再试</div>';
    }
}

// ========== 5. 启动 ==========
renderUI();
fetchDailyQuote();
fetchNews();
</script>
</body>
</html>
