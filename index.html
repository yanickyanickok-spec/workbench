<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>爆单的林舒琪</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="爆单林舒琪">
<style>
:root{
--blue:#3b7dd8;--blue-deep:#0a1628;--blue-medium:#1a3a6a;
--blue-light:#eef4fb;--gold:#FFD700;--green:#34C759;--red:#FF3B30;
--white:#fff;--radius:20px;--shadow:0 4px 20px rgba(59,125,216,.15);
--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
body{background:var(--blue-light);color:#333;min-height:100vh;padding-top:var(--safe-top);padding-bottom:calc(var(--safe-bottom) + 20px);-webkit-font-smoothing:antialiased;}

/* 侧栏 */
.sidebar{position:fixed;top:0;left:0;height:100%;width:280px;background:linear-gradient(180deg,var(--blue-deep),var(--blue-medium));transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:1000;padding:calc(20px + var(--safe-top)) 0 20px;display:flex;flex-direction:column;color:#fff;overflow-y:auto;}
.sidebar.open{transform:translateX(0);box-shadow:5px 0 30px rgba(0,0,0,.3);}
.profile-section{text-align:center;padding:20px;border-bottom:1px solid rgba(255,255,255,.1);cursor:pointer;}
.avatar{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--gold));display:flex;align-items:center;justify-content:center;font-size:35px;margin:0 auto 10px;border:3px solid var(--gold);}
.profile-name{font-size:1.2rem;font-weight:700;color:var(--gold);}
.profile-sub{font-size:.75rem;opacity:.7;margin-top:3px;}
.nav-list{flex:1;padding:15px 12px;display:flex;flex-direction:column;gap:4px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:12px;cursor:pointer;transition:all .2s;font-size:.95rem;user-select:none;}
.nav-item:hover,.nav-item:active{background:rgba(255,255,255,.1);}
.nav-item.active{background:var(--blue);font-weight:600;}
.nav-icon{font-size:1.3rem;width:26px;text-align:center;}
.sidebar-footer{padding:12px;display:flex;gap:8px;border-top:1px solid rgba(255,255,255,.1);}
.footer-btn{flex:1;padding:10px;border:none;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}
.footer-btn:active{background:rgba(255,255,255,.2);}

/* 主区 */
.main{min-height:100vh;transition:margin-left .3s;}
@media(min-width:768px){.main{margin-left:280px;}.sidebar{transform:translateX(0);}}
.topbar{display:flex;align-items:center;gap:15px;padding:15px 20px;padding-top:calc(15px + var(--safe-top));background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.05);position:sticky;top:0;z-index:100;}
.menu-btn{display:none;background:none;border:none;font-size:1.5rem;cursor:pointer;padding:5px;}
@media(max-width:767px){.menu-btn{display:block;}}
.page-title{font-size:1.3rem;font-weight:700;color:var(--blue-deep);}
.content{padding:20px;max-width:900px;margin:0 auto;}

/* 欢迎横幅 */
.welcome-banner{background:linear-gradient(135deg,var(--blue-deep),var(--blue-medium),var(--blue));border-radius:var(--radius);padding:25px;color:#fff;margin-bottom:25px;position:relative;overflow:hidden;}
.welcome-banner::after{content:'💰';position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:80px;opacity:.15;}
.welcome-greeting{font-size:.9rem;opacity:.85;}
.welcome-name{font-size:2rem;font-weight:800;color:var(--gold);margin:5px 0;}
.welcome-date{font-size:.85rem;opacity:.75;}
.rich-index{margin-top:20px;background:rgba(255,255,255,.1);border-radius:12px;padding:15px;}
.rich-index-label{font-size:.85rem;display:flex;justify-content:space-between;}
.rich-index-value{color:var(--gold);font-weight:700;font-size:1.1rem;}
.rich-index-bar{height:10px;background:rgba(255,255,255,.15);border-radius:5px;margin-top:8px;overflow:hidden;}
.rich-index-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));border-radius:5px;transition:width .8s ease;width:0%;}

/* 打卡 */
.checkin-card{background:#fff;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:25px;}
.checkin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.checkin-title{font-size:1.1rem;font-weight:700;color:var(--blue-deep);}
.streak-badge{background:var(--blue-light);color:var(--blue);padding:4px 12px;border-radius:15px;font-size:.85rem;font-weight:600;}
.checkin-body{display:flex;align-items:center;gap:20px;}
.progress-ring{width:80px;height:80px;border-radius:50%;flex-shrink:0;background:conic-gradient(var(--blue) 0%,#e0e0e0 0%);display:flex;align-items:center;justify-content:center;position:relative;transition:background .5s;}
.progress-ring::before{content:'';position:absolute;width:62px;height:62px;background:#fff;border-radius:50%;}
.ring-text{position:relative;z-index:1;font-weight:700;color:var(--blue);font-size:1.1rem;}
.tasks-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.task-item{display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 12px;background:var(--blue-light);border-radius:10px;transition:all .2s;user-select:none;}
.task-item:active{transform:scale(.97);}
.task-item.checked{background:rgba(52,199,89,.1);}
.task-item.checked span{color:var(--green);}
.task-checkbox{width:18px;height:18px;border:2px solid var(--blue);border-radius:4px;flex-shrink:0;transition:all .2s;display:flex;align-items:center;justify-content:center;}
.task-item.checked .task-checkbox{background:var(--green);border-color:var(--green);}
.task-item.checked .task-checkbox::after{content:'✓';color:#fff;font-size:12px;font-weight:bold;}
.task-item span{font-size:.9rem;}

/* 功能卡片 */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;}
.func-card{background:#fff;border-radius:var(--radius);padding:20px 18px;box-shadow:var(--shadow);cursor:pointer;transition:all .2s;border:2px solid transparent;position:relative;overflow:hidden;}
.func-card:active{transform:translateY(-3px);border-color:var(--blue);}
.func-card-icon{width:50px;height:50px;border-radius:14px;background:var(--blue-light);display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin-bottom:12px;}
.func-card-title{font-size:.95rem;font-weight:600;color:var(--blue-deep);}
.func-card-desc{font-size:.72rem;color:#999;margin-top:4px;line-height:1.3;}
.auto-badge{position:absolute;top:10px;right:10px;background:var(--gold);color:var(--blue-deep);font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:8px;}

/* 通用 */
.page{display:none;}
.page.active{display:block;animation:fadeIn .3s;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.panel{background:#fff;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:20px;}
.panel-title{font-size:1.15rem;font-weight:700;color:var(--blue-deep);margin-bottom:18px;display:flex;align-items:center;gap:8px;}

/* 自动banner */
.auto-banner{background:linear-gradient(135deg,#eef4fb,#e8f0fe);border:1px solid #d0e0fb;border-radius:12px;padding:12px 15px;margin-bottom:15px;display:flex;align-items:center;gap:10px;color:var(--blue);}
.auto-banner .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* 新闻条目 */
.news-item{background:var(--blue-light);border-radius:10px;padding:12px 15px;margin-bottom:8px;font-size:.9rem;line-height:1.4;border-left:4px solid var(--blue);}
.news-rank{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;background:var(--blue);color:#fff;border-radius:6px;font-size:.75rem;font-weight:700;margin-right:8px;}
.news-rank.top{background:var(--red);}

/* 按钮 */
.btn{padding:10px 20px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;justify-content:center;}
.btn:active{transform:scale(.96);}
.btn-gold{background:linear-gradient(135deg,var(--gold),#FFA500);color:var(--blue-deep);}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}

/* 饮食卡片 */
.meal-card{background:var(--blue-light);border-radius:12px;padding:15px;margin-bottom:10px;}
.meal-card h4{color:var(--blue-deep);margin-bottom:8px;}
.meal-cal{font-size:1.5rem;font-weight:800;color:var(--blue);}
.meal-protein{color:var(--green);font-weight:600;}

/* 理财tip */
.finance-tip{background:linear-gradient(135deg,#eef4fb,#f0f7ff);border-radius:12px;padding:15px;margin-bottom:10px;border-left:4px solid var(--gold);}
.finance-tip h4{color:var(--blue-deep);margin-bottom:6px;}

/* Toast */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(100px);background:var(--blue-deep);color:#fff;padding:14px 24px;border-radius:12px;z-index:2000;opacity:0;transition:all .3s;font-size:.9rem;box-shadow:0 5px 20px rgba(0,0,0,.3);max-width:90%;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

/* 弹窗 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:none;}
.overlay.show{display:block;}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:#fff;border-radius:var(--radius);padding:25px;z-index:1001;width:90%;max-width:400px;display:none;box-shadow:0 20px 60px rgba(0,0,0,.3);opacity:0;transition:all .3s;}
.modal.show{display:block;transform:translate(-50%,-50%) scale(1);opacity:1;}
.modal h3{color:var(--blue-deep);margin-bottom:20px;}
.modal-field{margin-bottom:15px;}
.modal-field label{display:block;font-size:.85rem;color:#666;margin-bottom:6px;}
input,textarea,select{width:100%;padding:12px 15px;border:2px solid var(--blue-light);border-radius:12px;font-size:.95rem;outline:none;transition:border-color .2s;font-family:inherit;margin-bottom:10px;}
input:focus,textarea:focus,select:focus{border-color:var(--blue);}
.modal-actions{display:flex;gap:10px;margin-top:25px;}
.modal-actions .btn{flex:1;}

/* 进度条 */
.progress-bar{height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;margin:5px 0;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:4px;transition:width .5s;}

/* 总结卡片 */
.summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:15px;}
.summary-card{background:var(--blue-light);border-radius:12px;padding:14px 12px;text-align:center;}
.summary-card .label{font-size:.75rem;color:#999;}
.summary-card .value{font-size:1.3rem;font-weight:700;margin-top:4px;color:var(--blue-deep);}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
<div class="profile-section" onclick="openEditProfile()">
<div class="avatar" id="sidebarAvatar">🐰</div>
<div class="profile-name" id="sidebarName">爆单的林舒琪</div>
<div class="profile-sub" id="sidebarSub">💰 搞钱·成长·爆单中</div>
</div>
<nav class="nav-list" id="navList"></nav>
<div class="sidebar-footer">
<button class="footer-btn" onclick="location.reload()">🔄 刷新</button>
<button class="footer-btn" onclick="openEditProfile()">✏️ 编辑</button>
</div>
</aside>

<main class="main">
<header class="topbar">
<button class="menu-btn" onclick="toggleSidebar()">☰</button>
<h1 class="page-title" id="currentPageTitle">仪表盘</h1>
</header>
<div class="content" id="contentArea"></div>
</main>

<div class="overlay" id="overlay" onclick="closeAllModals()"></div>

<div class="modal" id="editModal">
<h3>✏️ 编辑个人资料</h3>
<div class="modal-field"><label>显示名称</label><input type="text" id="editName" value="爆单的林舒琪"></div>
<div class="modal-field"><label>头像 Emoji</label><input type="text" id="editAvatar" value="🐰"></div>
<div class="modal-field"><label>副标题</label><input type="text" id="editSub" value="💰 搞钱·成长·爆单中"></div>
<div class="modal-actions">
<button class="btn" style="background:var(--blue-light);color:var(--blue);" onclick="closeAllModals()">取消</button>
<button class="btn btn-gold" onclick="saveProfile()">💾 保存</button>
</div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
const STORAGE_KEY='bangdan_lin_shuqi_v3';
let appData={profile:{name:'爆单的林舒琪',avatar:'🐰',sub:'💰 搞钱·成长·爆单中'},checkin:{},streak:0,notes:{},todos:[],tasks:[],holdings:[],hobbies:[],lastUpdate:''};
let dailyData={news:[],nail:[],finance:null,meal:null,lastUpdated:''};

const MODULES=[
{key:'dashboard',icon:'🏠',name:'仪表盘',desc:'概览今日',auto:false},
{key:'news',icon:'🔴',name:'新闻热点',desc:'每日实时热榜',auto:true},
{key:'finance_basic',icon:'🎓',name:'理财基本知识',desc:'每日理财概念',auto:true},
{key:'xhs_nail',icon:'💅',name:'小红书美甲爆款',desc:'每日爆款趋势',auto:true},
{key:'dy_nail',icon:'✨',name:'抖音美甲爆款',desc:'每日热榜提取',auto:true},
{key:'muscle_meal',icon:'🍗',name:'增肌营养餐管家',desc:'每日科学食谱',auto:true},
{key:'fitness',icon:'💪',name:'健身教练',desc:'训练计划',auto:false},
{key:'today_todo',icon:'⚡',name:'今日待办',desc:'关键事务',auto:false},
{key:'private_finance',icon:'🏦',name:'私人理财',desc:'资产追踪',auto:false},
{key:'hobby_progress',icon:'🎨',name:'兴趣爱好进度',desc:'成长轨迹',auto:false},
{key:'task_plan',icon:'📅',name:'每月每周任务',desc:'周期管理',auto:false},
{key:'todos',icon:'📋',name:'待计划',desc:'可编辑清单',auto:false},
];

const TASKS=[
{id:'fitness',label:'💪 健身训练'},{id:'reading',label:'📖 每日阅读'},
{id:'study',label:'📚 学习提升'},{id:'water',label:'💧 喝够8杯水'},
{id:'finance',label:'📈 理财复盘'},{id:'review',label:'✍️ 每日复盘'},
];

// ===== 初始化 =====
loadData();
loadDailyData();
renderSidebar();
renderPage('dashboard');
setTimeout(()=>{updateRichIndex();restoreCheckinUI();},300);

function loadData(){try{const s=localStorage.getItem(STORAGE_KEY);if(s)appData={...appData,...JSON.parse(s)};}catch(e){}}
function saveData(){localStorage.setItem(STORAGE_KEY,JSON.stringify(appData));}

function loadDailyData(){
fetch('data.json?t='+Date.now()).then(r=>r.json()).then(d=>{
dailyData=d;appData.lastUpdate=d.lastUpdated;saveData();renderPage(currentPage);
}).catch(()=>{showToast('⚠️ 数据加载失败，使用本地缓存');});
}

// ===== 侧栏 =====
function renderSidebar(){
document.getElementById('navList').innerHTML=MODULES.map(m=>`
<div class="nav-item" data-page="${m.key}" onclick="switchPage('${m.key}')">
<span class="nav-icon">${m.icon}</span><span>${m.name}</span></div>`).join('');
document.getElementById('sidebarAvatar').textContent=appData.profile.avatar;
document.getElementById('sidebarName').textContent=appData.profile.name;
document.getElementById('sidebarSub').textContent=appData.profile.sub;
document.title=appData.profile.name;
}

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}

let currentPage='dashboard';
function switchPage(p){
currentPage=p;
document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.page===p));
const m=MODULES.find(x=>x.key===p);
document.getElementById('currentPageTitle').textContent=m.name;
renderPage(p);
document.getElementById('sidebar').classList.remove('open');
window.scrollTo({top:0,behavior:'smooth'});
}

// ===== 渲染分发 =====
function renderPage(page){
const c=document.getElementById('contentArea');
const m=MODULES.find(x=>x.key===page);
if(page==='dashboard'){c.innerHTML=renderDashboard();bindCheckinEvents();return;}
let banner=m.auto?`<div class="auto-banner"><span class="dot"></span><div><div style="font-weight:700;">🤖 每日自动抓取更新</div><div style="font-size:.75rem;opacity:.8;">来源：orz.ai 热榜 / 深蓝财经 / 科学膳食库 · 更新于 ${dailyData.lastUpdated||'加载中...'}</div></div></div>`:'';
let body='';
switch(page){
case'news':body=renderNews();break;
case'finance_basic':body=renderFinance();break;
case'xhs_nail':body=renderXhs();break;
case'dy_nail':body=renderDy();break;
case'muscle_meal':body=renderMeal();break;
case'fitness':body=renderFitness();break;
case'today_todo':body=renderTodayTodo();break;
case'private_finance':body=renderPrivateFinance();break;
case'hobby_progress':body=renderHobby();break;
case'task_plan':body=renderTaskPlan();break;
case'todos':body=renderTodos();break;
}
c.innerHTML=`${banner}<div class="panel"><div class="panel-title">${m.icon} ${m.name}</div>${body}</div>
<div class="panel"><div class="panel-title">📝 我的笔记</div>
<textarea id="quickNote" rows="3" placeholder="写点什么..." style="margin-bottom:12px;"></textarea>
<button class="btn" onclick="addNote('${page}')">保存笔记</button>
<div id="noteHistory_${page}" style="margin-top:15px;">${(appData.notes[page]||[]).slice().reverse().map(n=>`
<div style="background:var(--blue-light);border-radius:10px;padding:12px 15px;margin-bottom:8px;font-size:.9rem;border-left:4px solid var(--blue);">
<div style="font-size:.7rem;color:#999;margin-bottom:4px;">${n.time}</div>${escapeHtml(n.text)}
<button onclick="deleteNote('${page}','${n.id}')" style="float:right;background:none;border:none;cursor:pointer;">🗑️</button></div>`).join('')||'<div style="color:#999;text-align:center;padding:10px;">暂无笔记</div>'}</div></div>`;
}

// ===== 仪表盘 =====
function renderDashboard(){
const today=getTodayKey();
const tc=(appData.checkin[today]||[]).length;
const tp=TASKS.length?Math.round(tc/TASKS.length*100):0;
const ri=calcRichIndex();
return `
<div class="welcome-banner">
<div class="welcome-greeting">${getGreeting()}</div>
<div class="welcome-name">${appData.profile.name}</div>
<div class="welcome-date">${formatDate(new Date())}</div>
<div class="rich-index"><div class="rich-index-label"><span>💰 爆单指数</span><span class="rich-index-value">${ri}%</span></div>
<div class="rich-index-bar"><div class="rich-index-fill" id="richFill" style="width:0%"></div></div></div>
</div>
<div class="checkin-card">
<div class="checkin-header"><div class="checkin-title">📌 今日打卡</div><div class="streak-badge">🔥 连续 ${appData.streak} 天</div></div>
<div class="checkin-body">
<div class="progress-ring" id="progressRing"><div class="ring-text" id="ringText">${tp}%</div></div>
<div class="tasks-grid" id="tasksGrid">
${TASKS.map(t=>`<div class="task-item ${(appData.checkin[today]||[]).includes(t.id)?'checked':''}" data-task="${t.id}"><div class="task-checkbox"></div><span>${t.label}</span></div>`).join('')}
</div></div>
<div style="margin-top:15px;font-size:.9rem;color:#666;">${getCheckinTip(tc,TASKS.length)}</div>
</div>
<div class="cards-grid">
${MODULES.filter(m=>m.key!=='dashboard').map(m=>`
<div class="func-card" onclick="switchPage('${m.key}')">
<div class="func-card-icon">${m.icon}</div><div class="func-card-title">${m.name}</div>
<div class="func-card-desc">${m.desc}</div>${m.auto?'<div class="auto-badge">自动</div>':''}</div>`).join('')}
</div>`;
}

// ===== 打卡 =====
function bindCheckinEvents(){
document.querySelectorAll('#tasksGrid .task-item').forEach(item=>{
item.onclick=()=>{
const t=item.dataset.task;const today=getTodayKey();
if(!appData.checkin[today])appData.checkin[today]=[];
const idx=appData.checkin[today].indexOf(t);
if(idx>=0){appData.checkin[today].splice(idx,1);item.classList.remove('checked');}
else{appData.checkin[today].push(t);item.classList.add('checked');}
calcStreak();updateCheckinUI();saveData();
};
});
}
function updateCheckinUI(){
const today=getTodayKey();
const tc=(appData.checkin[today]||[]).length;
const tp=Math.round(tc/TASKS.length*100);
document.getElementById('ringText').textContent=tp+'%';
document.getElementById('progressRing').style.background=`conic-gradient(var(--blue) ${tp}%, #e0e0e0 0)`;
}
function restoreCheckinUI(){
const today=getTodayKey();
const tc=(appData.checkin[today]||[]).length;
const tp=Math.round(tc/TASKS.length*100);
const rt=document.getElementById('ringText');if(rt)rt.textContent=tp+'%';
const pr=document.getElementById('progressRing');if(pr)pr.style.background=`conic-gradient(var(--blue) ${tp}%, #e0e0e0 0)`;
}
function calcStreak(){
const today=new Date();
let s=0;
for(let i=0;i<365;i++){const d=new Date(today);d.setDate(d.getDate()-i);const k=formatKey(d);if(appData.checkin[k]&&appData.checkin[k].length>0)s++;else if(i===0&&s===0)s=0;else break;}
appData.streak=s;
}
function calcRichIndex(){
const s=appData.streak||0;
const tc=Object.keys(appData.checkin).length;
const dc=(appData.todos||[]).filter(x=>x.done).length;
return Math.min(100,Math.round(s*10+tc*3+dc*5));
}
function updateRichIndex(){
const ri=calcRichIndex();
const fill=document.getElementById('richFill');if(fill)fill.style.width=ri+'%';
const rv=document.querySelectorAll('.rich-index-value');rv.forEach(el=>el.textContent=ri+'%');
}

// ===== 工具 =====
function getTodayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function formatKey(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function formatDate(d){const w=['日','一','二','三','四','五','六'];return `${d.getMonth()+1}月${d.getDate()}日 周${w[d.getDay()]}`;}
function getGreeting(){const h=new Date().getHours();if(h<5)return'🌙 夜深了，早点休息';if(h<12)return'☀️ 早上好';if(h<14)return'🍚 午安';if(h<18)return'🌤️ 下午好';return'🌇 晚上好，辛苦了';}
function getCheckinTip(c,t){if(c===0)return'🌱 新的一天，勾选开始打卡吧';if(c===t)return'🎉 全部完成！';return`💪 已完成 ${c}/${t}，还差 ${t-c} 项`;}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function closeAllModals(){document.getElementById('overlay').classList.remove('show');document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'));}
</script>
