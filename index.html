// ===== 渲染页面 =====
async function rPG(k){
let c=document.getElementById('ct');
let m=M.find(x=>x.d===k);

if(k==='dashboard'){c.innerHTML=rDB();bindCK();return}

// 自动模块：先加载数据再渲染
if(m.a){
let data=await fetchDailyData();
let banner=`<div class="auto-banner">
<div class="auto-banner-header">
<span class="icon">🤖</span>
<div><div class="title">每日自动抓取 · 真实更新</div><div class="auto-banner-meta"><span class="status-dot"></span>由 GitHub Actions 每天早8点自动抓取并更新 · 上次更新：${data.news?data.news.updated:'尚未'}</div></div>
</div>
</div>`;
let body='';
if(k==='news')body=`<div class="auto-banner-content">${esc(data.news.content)}</div>`;
if(k==='xhsnails')body=`<div class="auto-banner-content">${esc(data.xhs.content)}</div>`;
if(k==='dynails')body=`<div class="auto-banner-content">${esc(data.dy.content)}</div>`;

c.innerHTML=banner+`<div class="pn2"><div class="pt2">${m.i} ${m.n}</div>${body}</div>`+renderNotes(k);
return;
}

// 非自动模块
let body='';
switch(k){
case'fitness':body=rFit();break;
case'todaytodo':body=rTD2();break;
case'personalfin':body=rPF();break;
case'hobby':body=rHB();break;
case'tasksched':body=rTS();break;
case'todos':body=rTD();break;
}
c.innerHTML=`<div class="pn2"><div class="pt2">${m.i} ${m.n}</div>${body}</div>`+renderNotes(k);
bindMod(k);
}

function renderNotes(k){
let notes=(D.notes[k]||[]).slice().reverse();
let nh=notes.length?notes.map(n=>`<div class="ni2"><div class="nt">${n.t}</div><div>${esc(n.text)}</div><button class="lba" style="float:right" onclick="delN('${k}','${n.id}')">🗑️</button></div>`).join(''):'<div style="color:#999;text-align:center;padding:10px">暂无笔记</div>';
return`<div class="pn2"><div class="pt2">📝 我的笔记</div><textarea id="qN" rows="3" placeholder="写点什么..." style="margin-bottom:12px"></textarea><button class="btn" onclick="addN('${k}')">保存笔记</button><div class="nh" id="nh_${k}">${nh}</div></div>`;
}

// ===== 打卡 =====
function bindCK(){
document.querySelectorAll('#tg .ti').forEach(el=>{
el.onclick=()=>{
let t=el.dataset.t,td=D.ck[today()]=D.ck[today()]||[];
if(td.includes(t))td=td.filter(x=>x!==t);else td.push(t);
D.ck[today()]=td;
let y=new Date();y.setDate(y.getDate()-1);let yk=`${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
if(td.length>0&&D.ck[yk]&&D.ck[yk].length>0)D.streak++;
else if(td.length===0)D.streak=0;
else D.streak=Math.max(1,D.streak);
sv();rDB();bindCK();
};
});
}
function ckT(c,t){if(c===0)return'🌱 新的一天，勾选开始打卡吧';if(c===t)return'🎉 全部完成！';return`💪 已完成 ${c}/${t}，还差 ${t-c} 项`}
function calcRI(){let s=D.streak||0,tc=Object.keys(D.ck).length,nc=(D.todos||[]).filter(x=>x.done).length;return Math.min(100,Math.round(s*10+tc*5+nc*3))}

<button class="btn" onclick="addTS()">➕</button>
</div>
<h4 style="margin:15px 0 10px;color:var(--blue)">📅 每周任务 (${wt.length})</h4>
${wt.map(x=>`<div class="li ${x.done?'done':''}"><div class="lc" onclick="togWT('${x.id}')">${x.done?'✓':''}</div><div class="lt">${esc(x.text)}</div><div class="la"><button class="lba" onclick="edWT('${x.id}')">✏️</button><button class="lba" onclick="delWT('${x.id}')">🗑️</button></div></div>`).join('')||'<div style="color:#999;padding:5px 0">暂无</div>'}
<h4 style="margin:15px 0 10px;color:var(--gold)">📆 每月任务 (${mt.length})</h4>
${mt.map(x=>`<div class="li ${x.done?'done':''}"><div class="lc" onclick="togWT('${x.id}')">${x.done?'✓':''}</div><div class="lt">${esc(x.text)}</div><div class="la"><button class="lba" onclick="edWT('${x.id}')">✏️</button><button class="lba" onclick="delWT('${x.id}')">🗑️</button></div></div>`).join('')||'<div style="color:#999;padding:5px 0">暂无</div>'}`;
}
function addTS(){let v=document.getElementById('tsI').value.trim(),t=document.getElementById('tsT').value;if(!v)return toast('⚠️ 填内容');D.wt.push({id:rid(),text:v,done:false,type:t,date:'',createdAt:today()});document.getElementById('tsI').value='';sv();rPG('tasksched');toast('✅ 已添加')}

// ===== 记账 =====
function rRC(){
let mk=mKey(),mr=D.rc[mk]||[],days={};
mr.forEach(r=>{let d=r.date.split('-')[2];days[d]=(days[d]||0)+(r.type==='income'?r.amount:-r.amount)});
let t=new Date().getDate(),td=mr.filter(r=>r.date.endsWith('-'+String(t).padStart(2,'0')));
return`<div class="sc">
<div class="sc2"><div class="l">本月收入</div><div class="v in">¥${mr.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0).toFixed(0)}</div></div>
<div class="sc2"><div class="l">本月支出</div><div class="v ex">¥${mr.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0).toFixed(0)}</div></div>
<div class="sc2"><div class="l">本月结余</div><div class="v ${mr.reduce((s,r)=>s+(r.type==='income'?r.amount:-r.amount),0)>=0?'bp':'bn'}">¥${mr.reduce((s,r)=>s+(r.type==='income'?r.amount:-r.amount),0).toFixed(0)}</div></div>
</div>
<div style="display:flex;gap:10px;margin-bottom:15px">
<button class="btn btng" onclick="opRC('income')">💵 记收入</button>
<button class="btn" onclick="opRC('expense')">💸 记支出</button>
</div>
<h4 style="margin:10px 0;color:var(--blue)">📅 本月有记录的日期</h4>
<div class="dt">${Object.keys(days).sort().map(d=>`<span class="dtb ${days[d]>=0?'dti':'dte'}" onclick="toast('${d}日 详情见导出')">${d}日 ${days[d]>=0?'+':''}${days[d].toFixed(0)}</span>`).join('')}</div>
<h4 style="margin:15px 0 10px;color:var(--blue)">📋 今日流水 (${td.length})</h4>
${td.length?td.map(r=>`<div class="li"><span style="font-size:1.2rem">${r.type==='income'?'💰':'💸'}</span><div class="lt">${esc(r.purpose)}</div><span style="font-weight:600;color:${r.type==='income'?'var(--green)':'var(--red)'}">${r.type==='income'?'+':'-'}¥${r.amount.toFixed(2)}</span><button class="lba" onclick="delRC('${r.id}')">🗑️</button></div>`).join(''):'<div style="color:#999;padding:10px">今日暂无记录</div>'}`;
}
function opRC(t){document.getElementById('rT').value=t;document.getElementById('rcT').textContent=t==='income'?'💵 记收入':'💸 记支出';clsMD();document.getElementById('ov').classList.add('sh');document.getElementById('mdRC').classList.add('sh')}
function addRC(){let t=document.getElementById('rT').value,p=document.getElementById('rP').value.trim(),a=parseFloat(document.getElementById('rA').value);if(!p||!a)return toast('⚠️ 填完整');let mk=mKey();D.rc[mk]=D.rc[mk]||[];D.rc[mk].push({id:rid(),type:t,purpose:p,amount:a,date:today()});sv();clsMD();rPG('personalfin');toast('✅ 已记录')}
function delRC(id){let mk=mKey();D.rc[mk]=D.rc[mk].filter(r=>r.id!==id);sv();rPG(curP)}

// ===== 笔记 =====
function addN(k){let v=document.getElementById('qN').value.trim();if(!v)return toast('⚠️ 写点什么');(D.notes[k]=D.notes[k]||[]).push({id:rid(),text:v,time:new Date().toLocaleString()});document.getElementById('qN').value='';sv();rPG(k);toast('✅ 笔记已保存')}
function delN(k,id){D.notes[k]=(D.notes[k]||[]).filter(x=>x.id!==id);sv();rPG(curP)}

// ===== 编辑资料 =====
function openEM(){document.getElementById('eN').value=D.profile.name;document.getElementById('eA').value=D.profile.avatar;document.getElementById('eS').value=D.profile.sub;initEP();clsMD();document.getElementById('ov').classList.add('sh');document.getElementById('mdEM').classList.add('sh')}
function svP(){D.profile.name=document.getElementById('eN').value.trim()||'爆单的林舒琪';D.profile.avatar=document.getElementById('eA').value.trim()||'🐰';D.profile.sub=document.getElementById('eS').value.trim()||'';sv();rSB();clsMD();toast('✅ 已保存')}
const EMOJIS=['🐰','🐇','🐹','🐻','🐼','🦁','🐯','🦊','👸','🧜‍♀️','👑','💎','⭐','🌸','🔥','🚀','💰','🍀'];
function initEP(){let c='';EMOJIS.forEach(e=>{c+=`<div class="eo ${e===D.profile.avatar?'sel':''}" onclick="pickE('${e}')">${e}</div>`});document.getElementById('ep').innerHTML=c}
function pickE(e){document.getElementById('eA').value=e;document.querySelectorAll('.eo').forEach(el=>el.classList.toggle('sel',el.textContent===e))}

// ===== 弹窗/搜索/导入导出 =====
function clsMD(){document.getElementById('ov').classList.remove('sh');document.querySelectorAll('.md').forEach(m=>m.classList.remove('sh'))}
function togSB(){document.getElementById('sb').classList.toggle('open')}
function flt(){let q=document.getElementById('si').value.toLowerCase();document.querySelectorAll('.fc').forEach(c=>{c.style.display=c.dataset.s.toLowerCase().includes(q)?'':'none'})}
function expD(){let blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`爆单的林舒琪_${getDayKey()}.json`;a.click();toast('📤 已导出')}
function impD(){document.getElementById('fI').click()}
function hImp(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{try{D=JSON.parse(ev.target.result);sv();rSB();rPG(curP);toast('📥 导入成功')}catch(err){toast('❌ 格式错误')}};r.readAsText(f)}

// ===== 初始化 =====
function bindMod(k){}
rSB();
rPG('dashboard');
// 首次加载自动抓取最新数据
fetchDailyData().then(()=>{if(curP!=='dashboard')rPG(curP)});

// 注册 Service Worker 用于离线缓存
if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
