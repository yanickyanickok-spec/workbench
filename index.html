.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:none;backdrop-filter:blur(3px);}

.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:#fff;border-radius:var(--radius);padding:25px;z-index:1001;width:90%;max-width:500px;display:none;box-shadow:0 20px 60px rgba(0,0,0,.3);opacity:0;transition:all .3s;max-height:80vh;overflow-y:auto;}

.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(100px);background:var(--blue-deep);color:#fff;padding:14px 24px;border-radius:12px;z-index:2000;opacity:0;transition:all .3s;font-size:.9rem;box-shadow:0 5px 20px rgba(0,0,0,.3);}

function fetchDataJson(){
fetch('data.json?t='+Date.now()).then(r=>r.json()).then(d=>{
dailyData=d;
appData.lastUpdate=d.lastUpdated||'';
saveLocal();
if(currentPage!=='dashboard')renderPage(currentPage);
}).catch(()=>{});
}

function loadLocal(){try{const s=localStorage.getItem(STORAGE_KEY);if(s)appData={...appData,...JSON.parse(s)};}catch(e){}}
function saveLocal(){localStorage.setItem(STORAGE_KEY,JSON.stringify(appData));}

function renderSidebar(){
document.getElementById('navList').innerHTML=MODULES.map(m=>
`<div class="nav-item ${m.key===currentPage?'active':''}" data-page="${m.key}" onclick="switchPage('${m.key}')">
<span style="font-size:1.3rem;width:26px;text-align:center;">${m.icon}</span><span>${m.name}</span></div>`).join('');
document.getElementById('sidebarAvatar').textContent=appData.profile.avatar;
document.getElementById('sidebarName').textContent=appData.profile.name;
document.getElementById('sidebarSub').textContent=appData.profile.sub;
document.title=appData.profile.name;
}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}

function switchPage(p){
currentPage=p;
document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.page===p));
document.getElementById('currentPageTitle').textContent=MODULES.find(x=>x.key===p).name;
renderPage(p);
document.getElementById('sidebar').classList.remove('open');
window.scrollTo({top:0,behavior:'smooth'});
}

function renderPage(page){
const c=document.getElementById('contentArea');
switch(page){
case 'dashboard':c.innerHTML=renderDashboard();bindCheckin();break;
case 'news':c.innerHTML=renderNews();break;
case 'finance':c.innerHTML=renderFinance();break;
case 'xhs_nail':c.innerHTML=renderXhs();break;
case 'dy_nail':c.innerHTML=renderDy();break;
case 'meal':c.innerHTML=renderMeal();break;
case 'fitness':c.innerHTML=renderFitness();break;
case 'todos':c.innerHTML=renderTodos();break;
}
}

<div class="welcome-banner">

<div class="welcome-name">${appData.profile.name}</div>

<div class="rich-index"><div class="rich-index-label"><span>\uD83D\uDCB0 爆单指数</span><span class="rich-index-value">${ri}%</span></div>

</div>
<div class="auto-banner"><span class="dot"></span><div><div style="font-weight:700;">\uD83D\uDCE1 每日自动更新中</div><div style="font-size:.75rem;opacity:.8;">${dataStatus}</div></div></div>
<div class="checkin-card">
<div class="checkin-header"><div class="checkin-title">\uD83D\uDCCC 今日打卡</div><div class="streak-badge">\uD83D\uDD25 连续 ${appData.streak} 天</div></div>
<div class="checkin-body">
<div class="progress-ring" id="progressRing"><div class="ring-text" id="ringText">${tp}%</div></div>
<div class="tasks-grid" id="tasksGrid">
${TASKS.map(t=>`<div class="task-item ${(appData.checkin[today]||[]).includes(t.id)?'checked':''}" data-task="${t.id}"><div class="task-checkbox"></div><span>${t.label}</span></div>`).join('')}

<div class="cards-grid">
${MODULES.filter(m=>m.key!=='dashboard').map(m=>
`<div class="func-card" onclick="switchPage('${m.key}')">

// 打卡
function bindCheckin(){
document.querySelectorAll('#tasksGrid .task-item').forEach(item=>{
item.onclick=()=>{
const t=item.dataset.task;const today=getTodayKey();
if(!appData.checkin[today])appData.checkin[today]=[];
const idx=appData.checkin[today].indexOf(t);
if(idx>=0){appData.checkin[today].splice(idx,1);item.classList.remove('checked');}
else{appData.checkin[today].push(t);item.classList.add('checked');}
calcStreak();updateCheckinUI();saveLocal();
};
});
}
function updateCheckinUI(){
const today=getTodayKey();const tc=(appData.checkin[today]||[]).length;const tp=Math.round(tc/TASKS.length*100);
const rt=document.getElementById('ringText');if(rt)rt.textContent=tp+'%';
const pr=document.getElementById('progressRing');if(pr)pr.style.background=`conic-gradient(var(--blue) ${tp}%, #e0e0e0 0)`;
}
function restoreCheckinUI(){
const today=getTodayKey();const tc=(appData.checkin[today]||[]).length;const tp=Math.round(tc/TASKS.length*100);
const rt=document.getElementById('ringText');if(rt)rt.textContent=tp+'%';
const pr=document.getElementById('progressRing');if(pr)pr.style.background=`conic-gradient(var(--blue) ${tp}%, #e0e0e0 0)`;
}
function calcStreak(){
const today=new Date();let s=0;
for(let i=0;i<365;i++){const d=new Date(today);d.setDate(d.getDate()-i);const k=formatKey(d);if(appData.checkin[k]&&appData.checkin[k].length>0)s++;else if(i===0&&s===0)s=0;else break;}
appData.streak=s;
}
function calcRichIndex(){
const s=appData.streak||0;const tc=Object.keys(appData.checkin).length;const dc=(appData.todos||[]).filter(x=>x.done).length;
return Math.min(100,Math.round(s*10+tc*3+dc*5));
}
function updateRichIndex(){
const ri=calcRichIndex();
const fill=document.getElementById('richFill');if(fill)fill.style.width=ri+'%';
document.querySelectorAll('.rich-index-value').forEach(el=>el.textContent=ri+'%');
}

// 待办
function addTodo(){const v=document.getElementById('todoInput').value.trim();if(!v)return;appData.todos.push({id:Date.now().toString(36),text:v,done:false});document.getElementById('todoInput').value='';saveLocal();renderPage('todos');showToast('\u2705 已添加');}
function toggleTodo(id){const t=appData.todos.find(x=>x.id===id);if(t)t.done=!t.done;saveLocal();renderPage('todos');}
function delTodo(id){appData.todos=appData.todos.filter(x=>x.id!==id);saveLocal();renderPage('todos');}

// 笔记
function saveFitnessNotes(){appData.fitness_notes=document.getElementById('fitnessNotes').value;saveLocal();showToast('\uD83D\uDCAA 健身笔记已保存');}
function saveMealNotes(){appData.meal_notes=document.getElementById('mealNotes').value;saveLocal();showToast('\uD83C\uDF57 饮食笔记已保存');}

// 弹窗
function showDetail(title,content){
document.getElementById('detailContent').innerHTML=`<h3>${escHtml(title)}</h3><p style="font-size:.95rem;line-height:1.8;">${escHtml(content).replace(/\\n/g,'<br>')}</p>`;
document.getElementById('overlay').classList.add('show');
document.getElementById('detailModal').classList.add('show');
}
function closeAllModals(){document.getElementById('overlay').classList.remove('show');document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'));}

// 编辑资料
function openEditProfile(){
document.getElementById('editName').value=appData.profile.name;
document.getElementById('editAvatar').value=appData.profile.avatar;
document.getElementById('editSub').value=appData.profile.sub;
document.getElementById('overlay').classList.add('show');
document.getElementById('editModal').classList.add('show');
}
function saveProfile(){
appData.profile.name=document.getElementById('editName').value.trim()||'爆单的林舒琪';
appData.profile.avatar=document.getElementById('editAvatar').value.trim()||'\uD83D\uDC30';
appData.profile.sub=document.getElementById('editSub').value.trim()||'';
saveLocal();renderSidebar();closeAllModals();showToast('\u2705 已保存');
}

// 工具
function getTodayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function formatKey(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function formatDate(d){const w=['日','一','二','三','四','五','六'];return `${d.getMonth()+1}月${d.getDate()}日 周${w[d.getDay()]}`;}
function getGreeting(){const h=new Date().getHours();if(h<5)return'\uD83C\uDF19 夜深了，早点休息';if(h<12)return'\u2600\uFE0F 早上好';if(h<14)return'\uD83C\uDF5A 午安';if(h<18)return'\uD83C\uDFE4\uFE0F 下午好';return'\uD83C\uDFC7 晚上好，辛苦了';}
function getCheckinTip(c,t){if(c===0)return'\uD83C\uDF31 新的一天，勾选开始打卡吧';if(c===t)return'\uD83C\uDF89 全部完成！太强了！';return `\uD83D\uDCAA 已完成 ${c}/${t}，还差 ${t-c} 项`;}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escJs(s){return String(s||'').replace(/'/g,"\\'").replace(/\n/g,'\\n');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// 每10分钟检测更新
setInterval(fetchDataJson,600000);
</script>
