name: 每日数据更新

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成数据文件
        run: |
          cd workbench
          node -e "
          const fs = require('fs');
          const raw = fs.readFileSync('data.js', 'utf-8');
          const match = raw.match(/const DB = (\{[\s\S]*?\});/);
          if (!match) { console.error('找不到 DB 数据'); process.exit(1); }
          const data = eval('(' + match[1] + ')');
          fs.writeFileSync('../data.json', JSON.stringify(data, null, 2));
          console.log('data.json 已生成');
          "
          cd ..
          echo "更新时间: $(date +'%Y-%m-%d %H:%M:%S')" > update-log.txt

      - name: 提交更新
        run: |
          git config user.name "自动更新机器人"
          git config user.email "bot@github.com"
          git add data.json update-log.txt
          git commit -m "自动更新数据 $(date +'%Y-%m-%d')" || echo "没有变化需要提交"
          git push
