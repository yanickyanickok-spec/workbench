name: 每日数据更新

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成数据文件
        run: |
          # 使用引号包裹路径，彻底解决中文、空格、特殊字符问题
          FOLDER="workbench 工作台"
          
          # 检查文件夹是否真的存在（做个保险）
          if [ ! -d "$FOLDER" ]; then
            echo "错误：找不到文件夹 '$FOLDER'"
            echo "当前目录下的文件夹有："
            ls -l
            exit 1
          fi
          
          echo "正在进入文件夹..."
          cd "$FOLDER"
          
          node -e "
          const fs = require('fs');
          try {
            const raw = fs.readFileSync('data.js', 'utf-8');
            const match = raw.match(/const DB = (\{[\s\S]*?\});/);
            if (!match) { 
              console.error('❌ 在 data.js 中找不到 DB 数据，请检查文件内容'); 
              process.exit(1); 
            }
            const data = eval('(' + match[1] + ')');
            fs.writeFileSync('../data.json', JSON.stringify(data, null, 2));
            console.log('✅ data.json 已成功生成');
          } catch (err) {
            console.error('❌ 读取文件失败:', err);
            process.exit(1);
          }
          "
          cd ..
          echo "更新时间: $(date +'%Y-%m-%d %H:%M:%S')" > update-log.txt

      - name: 提交更新
        run: |
          git config user.name "自动更新机器人"
          git config user.email "bot@github.com"
          git add data.json update-log.txt
          git commit -m "自动更新数据 $(date +'%Y-%m-%d')" || echo "没有变化需要提交"
          git push
