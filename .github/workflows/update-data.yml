name: 每日数据更新

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成数据文件
        run: |
          cd workbench
          node -e 'const fs=require("fs");const r=fs.readFileSync("data.js","utf-8");const s=r.indexOf("{");const e=r.lastIndexOf("}");const d=JSON.parse(r.substring(s,e+1));fs.writeFileSync("../data.json",JSON.stringify(d,null,2));console.log("done");'
          cd ..

      - name: 提交更新
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add data.json || true
          git commit -m "update" || true
          git push || true
