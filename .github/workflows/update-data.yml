name: 每日数据更新

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成数据文件
        run: |
          # === 终极暴力拉取：强制展开所有文件夹和子模块 ===
          git fetch --unshallow
          git checkout main  # 确保你的分支名是 main，如果是 master 就改成 master
          
          echo "正在强制拉取所有历史记录和子文件夹..."
          git pull --recurse-submodules --force
          
          echo "当前目录下的所有文件夹和文件："
          ls -la
          
          echo "正在进入 workbench 文件夹..."
          cd workbench
          
          echo "正在生成 data.json..."
          
          # 执行转换逻辑
          node -e "
          const fs = require('fs');
          try {
            const raw = fs.readFileSync('data.js', 'utf-8');
            const match = raw.match(/const DB = (\{[\s\S]*?\});/);
            if (!match) { 
              console.error('❌ 在 data.js 中找不到 DB 数据'); 
              process.exit(1); 
            }
            const data = eval('(' + match[1] + ')');
            fs.writeFileSync('../data.json', JSON.stringify(data, null, 2));
            console.log('✅ data.json 生成成功！');
          } catch (err) {
            console.error('❌ 发生错误:', err);
            process.exit(1);
          }
          "
          
          cd ..
          echo "更新完成！"

      - name: 提交更新
        run: 
          git config user.name "自动更新机器人"
          git config user.email "bot@github.com"
          git add data.json
          git commit -m "自动更新数据 $(date +'%Y-%m-%d')" || echo "没有变化需要提交"
          git push
