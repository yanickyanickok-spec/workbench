name: 每日数据更新

on:
  schedule:
    - cron: '0 8 * * *'   # 每天北京时间 16:00 跑（UTC 08:00）
  workflow_dispatch:        # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成数据文件
        run: |
          echo "数据更新时间: $(date +'%Y-%m-%d %H:%M:%S')" > update-log.txt
          node -e "
          const fs = require('fs');
          const data = require('./data.js');
          fs.writeFileSync('data.json', JSON.stringify(data, null, 2));
          console.log('data.json 已生成');
          "

      - name: 提交更新
        run: |
          git config user.name "自动更新机器人"
          git config user.email "bot@github.com"
          git add data.json update-log.txt
          git commit -m "自动更新数据 $(date +'%Y-%m-%d')" || echo "没有变化需要提交"
          git push
