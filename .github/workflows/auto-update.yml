name: 爆单的林舒琪 · 每日自动抓取

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC时间0点（北京时间早上8点）自动运行
  workflow_dispatch:      # 允许你在手机上手动点击运行

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 给写入权限，不然没法保存数据
    steps:
      - name: 📦 检出代码
        uses: actions/checkout@v4

      - name: 🚀 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 安装依赖
        run: npm install axios cheerio

      - name: 🔄 抓取今日数据
        run: node generate-data.js

      - name: 💾 提交更新
        run: |
          git config --global user.name '爆单林舒琪 Bot'
          git config --global user.email 'bot@example.com'
          git add data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 每日自动更新数据 $(date +'%Y-%m-%d')"
          git push
